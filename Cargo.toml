[package]
name = "padd"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A light, fast editor for Markdown and structured text, with encrypted secrets"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",          # OpenGL renderer: ~3 MB lighter than wgpu
    "default_fonts",
    "system_fonts",  # on-demand OS font fallback: emoji, CJK, Arabic… (+0.5 MB)
    "clipboard",
    "wayland",
    "x11",
] }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
age = { version = "0.12", default-features = false, features = ["armor"] }
zeroize = "1.9"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

[features]
default = []
a11y = ["eframe/accesskit"] # screen-reader support, +1.6 MB

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep dev builds snappy but make the hot crates fast enough to feel real.
[profile.dev.package."*"]
opt-level = 2

# The password KDF is the one hot loop that matters: build it for speed,
# not size (scrypt 2^18 goes from ~3 s to well under 1 s).
[profile.release.package.scrypt]
opt-level = 3
[profile.release.package.salsa20]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
